<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DietPlanner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="container">
    <header>
      <h1>DietPlanner</h1>
      <p>AI-Powered Personalized Meal Planning</p>
      <button id="darkToggle" class="btn-theme print-hide">🌙 Dark</button>
    </header>

    <div class="content">
      <!-- Input Form -->
      <div class="card" id="form-card">
        <h2>Your Profile</h2>
        <form id="profile-form">
          <div class="form-row">
            <div class="form-group">
              <label>Age</label>
              <input id="age" type="number" min="10" max="100" required>
            </div>
            <div class="form-group">
              <label>Gender</label>
              <select id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Height (cm)</label>
              <input id="height" type="number" min="100" max="250" step="0.1" required>
            </div>
            <div class="form-group">
              <label>Weight (kg)</label>
              <input id="weight" type="number" min="35" max="300" step="0.1" required>
            </div>
          </div>

          <div class="form-group">
            <label>Activity Level</label>
            <select id="activity">
              <option value="sedentary">Sedentary</option>
              <option value="light">Light</option>
              <option value="moderate" selected>Moderate</option>
              <option value="active">Active</option>
            </select>
          </div>

          <div class="form-group">
            <label>Goal</label>
            <select id="goal">
              <option value="fat_loss">Fat Loss</option>
              <option value="maintenance" selected>Maintenance</option>
              <option value="muscle_gain">Muscle Gain</option>
            </select>
          </div>

          <div class="form-group">
            <label>Diet Type</label>
            <select id="diet_type">
              <option value="omnivore" selected>Omnivore</option>
              <option value="vegetarian">Vegetarian</option>
              <option value="vegan">Vegan</option>
            </select>
          </div>

          <div class="form-group">
            <label>Days</label>
            <select id="days">
              <option value="3">3</option>
              <option value="5">5</option>
              <option value="7" selected>7</option>
              <option value="14">14</option>
              <option value="30">30</option>
            </select>
          </div>

          <div class="form-group">
            <label>Exclude Ingredients (comma separated)</label>
            <input id="exclude" placeholder="e.g., peanuts, dairy">
          </div>

          <button type="submit" class="btn-primary">Generate Meal Plan</button>
        </form>
      </div>

      <!-- Loading -->
      <div class="card" id="loading" style="display:none;">
        <div class="loading-spinner"></div>
        <p>Generating your personalized meal plan...</p>
      </div>

      <!-- Results -->
      <div class="card" id="results" style="display:none;">
        <h2>Your Meal Plan</h2>
        <div id="notice" class="notice-banner" style="display:none;"></div>

        
        <div class="targets" id="targets"></div>
        <div class="plan" id="plan"></div>
        
        <div class="actions print-hide">
          <button id="btn-print" class="btn-tertiary">Print / Save PDF</button>
          <button id="btn-save-json" class="btn-tertiary">Download JSON</button>
        </div>

        <button onclick="resetForm()" class="btn-secondary">Create New Plan</button>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  
  <!-- Initialize Choices after DOM is ready -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      ['gender','activity','goal','diet_type','days'].forEach(id => {
        new Choices('#' + id, {
          searchEnabled: false,
          itemSelectText: '',
          shouldSort: false
        });
      });
    });
  </script>
  <script>
    const t = document.getElementById('darkToggle');
    t.onclick=()=>{ document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark')?'dark':'light';
    };
    if(localStorage.theme==='dark') document.documentElement.classList.add('dark');
  </script>
  <!-- Use your external JS that wires Save/Print -->
  <script src="app.js"></script>

</body>
</html>
